name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: cd apps/server && npm ci

      - name: Generate Prisma Client
        run: cd apps/server && npx prisma generate

      - name: Install web dependencies
        run: cd apps/web && npm ci

      - name: Lint
        run: cd apps/web && npm run lint

      - name: Type Check Server
        run: cd apps/server && npx tsc --noEmit
        continue-on-error: true

      - name: Type Check Web
        run: cd apps/web && npx tsc --noEmit
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ahhhmetv_test
          POSTGRES_USER: ahhhmetv
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          cd apps/server && npm ci
          cd ../web && npm ci

      - name: Generate Prisma Client
        run: cd apps/server && npx prisma generate

      - name: Run Prisma Migrations
        run: cd apps/server && npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://ahhhmetv:test_password@localhost:5432/ahhhmetv_test?schema=public

      - name: Run Server Tests
        run: cd apps/server && npm test
        env:
          DATABASE_URL: postgresql://ahhhmetv:test_password@localhost:5432/ahhhmetv_test?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret
          JWT_REFRESH_SECRET: test-refresh-secret

      - name: Run Web Tests
        run: cd apps/web && npm test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          cd apps/server && npm ci
          cd ../web && npm ci

      - name: Generate Prisma Client
        run: cd apps/server && npx prisma generate

      - name: Build Server
        run: cd apps/server && npm run build

      - name: Build Web
        run: cd apps/web && npm run build

  docker:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Images
        run: docker-compose build

      - name: Verify containers start
        run: |
          docker-compose up -d postgres redis
          sleep 5
          docker-compose ps
          docker-compose down
